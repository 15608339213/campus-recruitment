# Alembic 配置文件
# 文档: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# 迁移脚本目录
script_location = alembic

# 模板（标准）
# file_template = %%(rev)s_%%(slug)s

# 时间戳模板
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# 数据库 URL（异步驱动由 env.py 处理，这里用同步 URL 仅作占位）
# 实际 URL 从 app.core.config.settings 读取
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/campus_recruit

# 追加路径
prepend_sys_path = .

# 版本表名
version_table = alembic_version

# 是否包含空迁移
# recursive_version_locations = false

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
