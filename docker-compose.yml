# ============================================================
# 秋招助手 - 一键启动全栈服务
#
# 用法：
#   docker compose up -d                    # 启动所有服务
#   docker compose up -d postgres redis     # 仅启动数据库和缓存
#   docker compose --profile full up -d      # 启动完整全栈（含后端+前端）
#   docker compose down                      # 停止并移除容器
#   docker compose down -v                   # 停止并删除数据卷（慎用）
#
# 访问地址：
#   前端：  http://localhost:8080
#   后端API：http://localhost:8000/docs
#   pgAdmin：http://localhost:5050（需 --profile pgadmin）
# ============================================================

services:
  # ===== PostgreSQL 15 =====
  postgres:
    image: postgres:15-alpine
    container_name: campus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus123
      POSTGRES_DB: campus_recruitment
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_recruitment"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===== Redis 7 =====
  redis:
    image: redis:7-alpine
    container_name: campus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - campus-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ===== 后端 API 服务 =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus-backend
    restart: unless-stopped
    environment:
      APP_NAME: 秋招助手后端
      APP_ENV: production
      DEBUG: "false"
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+asyncpg://campus:campus123@postgres:5432/campus_recruitment
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      BACKEND_CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
      # AI 配置（用户也可在前端「AI 设置」页面自行配置）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-chat
      AI_DAILY_LIMIT: "10"
      # OAuth（可选）
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "8000:8000"
    networks:
      - campus-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    profiles:
      - full

  # ===== 前端 Web 服务 =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: campus-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - campus-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    profiles:
      - full

  # ===== pgAdmin（可选，数据库可视化管理）=====
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: campus-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@campus.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/pgadmin
    networks:
      - campus-net
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - pgadmin

# ===== 网络 =====
networks:
  campus-net:
    driver: bridge
    name: campus-net

# ===== 持久化数据卷 =====
volumes:
  postgres_data:
    name: campus_postgres_data
  redis_data:
    name: campus_redis_data
  pgadmin_data:
    name: campus_pgadmin_data
