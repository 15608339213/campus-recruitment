# ============================================================
# 秋招助手 - 腾讯云一键部署
#
# 用法：
#   docker compose up -d --build      # 启动全栈服务
#   docker compose down               # 停止所有服务
#   docker compose logs -f backend    # 查看后端日志
#   docker compose down -v            # 停止并删除数据（慎用）
#
# 访问地址（替换为你的服务器 IP）：
#   前端：  http://你的服务器IP
#   后端API：http://你的服务器IP/api/v1/docs
#
# 首次部署：
#   1. 设置环境变量：export SERVER_IP=你的服务器公网IP
#   2. docker compose up -d --build
# ============================================================

services:
  # ===== PostgreSQL 15 =====
  postgres:
    image: postgres:15-alpine
    container_name: campus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus123
      POSTGRES_DB: campus_recruitment
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_recruitment"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===== Redis 7 =====
  redis:
    image: redis:7-alpine
    container_name: campus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - campus-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ===== 后端 API 服务 =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus-backend
    restart: unless-stopped
    environment:
      APP_NAME: 秋招助手后端
      APP_ENV: production
      DEBUG: "false"
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+asyncpg://campus:campus123@postgres:5432/campus_recruitment
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      # CORS：仅允许服务器自身和本地开发环境
      BACKEND_CORS_ORIGINS: '["http://120.53.31.101","http://localhost:5173","http://localhost:3000"]'
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: "lax"
      # AI 配置（用户也可在前端「AI 设置」页面自行配置）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-chat
      AI_DAILY_LIMIT: "10"
      # OAuth（可选）
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    networks:
      - campus-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ===== 前端 Web 服务 =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # 不传 VITE_API_BASE_URL，前端默认用 /api/v1，nginx 反向代理到后端
    container_name: campus-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - campus-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ===== pgAdmin（可选，数据库可视化管理）=====
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: campus-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@campus.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/pgadmin
    networks:
      - campus-net
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - pgadmin

# ===== 网络 =====
networks:
  campus-net:
    driver: bridge
    name: campus-net

# ===== 持久化数据卷 =====
volumes:
  postgres_data:
    name: campus_postgres_data
  redis_data:
    name: campus_redis_data
  pgadmin_data:
    name: campus_pgadmin_data
