# ============================================================
# 定时爬虫工作流
# 每天北京时间 8:00 自动执行岗位数据抓取
# ============================================================
name: 定时爬虫

on:
  schedule:
    # cron 使用 UTC 时区，UTC 0:00 = 北京时间 8:00
    - cron: '0 0 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  crawl:
    name: 执行岗位爬虫
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 执行爬虫任务
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APP_ENV: production
        run: |
          cd backend
          mkdir -p ../logs
          python -m app.services.crawler 2>&1 | tee ../logs/crawler-$(date +%Y%m%d).log
          echo "爬虫任务执行完毕"

      - name: 提交爬虫日志
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d "logs" ] && [ -n "$(ls -A logs 2>/dev/null)" ]; then
            git add logs/ || true
            git commit -m "chore: update crawler logs $(date +%Y-%m-%d) [skip ci]" || echo "No changes to commit"
            git push || echo "Push failed, skipping"
          else
            echo "No log files to commit"
          fi
